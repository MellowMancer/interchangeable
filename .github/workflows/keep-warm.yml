# Render spins a free web service down after 15 minutes without inbound traffic, and
# every page is a Server Component, so a sleeping API does not degrade a page — it stalls
# it. Pinging inside that window keeps the demo instant.
#
# 13 minutes, not 15: the schedule fires at :00 :13 :26 :39 :52, so the longest gap is
# 13 minutes and the service never reaches the threshold. GitHub delays scheduled runs
# under load, which is the weak point — see the note in README.md#deploying.
name: keep the api warm

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

# A late run is worth more than a cancelled one, but two at once buy nothing.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # --max-time covers a genuine cold start, which costs ~40s on a 0.1 CPU instance
      # if a run was skipped. Failing loudly is the point: a red run means the ping
      # lapsed or the service is down, which is worth an email before demo day.
      - name: ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
            https://interchangeable-api.onrender.com/health
