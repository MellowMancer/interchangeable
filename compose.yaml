services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      IXQ_DATA_DIR: /app/data
    volumes:
      # The database is local state, not an image artifact — `data` stays in
      # .dockerignore so it is never baked in, and is supplied at runtime instead.
      - ./data:/app/data
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/api/src
        - action: sync
          path: ./packages/bdheal/src
          target: /app/packages/bdheal/src
        - action: rebuild
          path: ./api/pyproject.toml
        - action: rebuild
          path: ./packages/bdheal/pyproject.toml
        - action: rebuild
          path: ./uv.lock

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Every page is a Server Component, so fetches leave the web container and must
      # address the API by service name. A browser-side URL is deliberately not defined
      # here: nothing fetches from the browser yet, and an unused one invites a client
      # component to depend on config only compose supplies.
      API_URL: http://api:8000
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/package.json
    depends_on:
      - api
