services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/api/src
        - action: sync
          path: ./packages/bdheal/src
          target: /app/packages/bdheal/src
        - action: rebuild
          path: ./api/pyproject.toml
        - action: rebuild
          path: ./packages/bdheal/pyproject.toml
        - action: rebuild
          path: ./uv.lock

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/package.json
    depends_on:
      - api
