services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      IXQ_DATA_DIR: /app/data
    # The image serves; dev reloads. `--reload` lives here rather than in the
    # Dockerfile CMD so a deployed container is not watching a filesystem that
    # never changes — but the `develop.watch` syncs below still need it.
    command:
      - uv
      - run
      - --frozen
      - --package
      - ixq
      - uvicorn
      - ixq.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      # In dev the database is local state the pipeline writes, so it is supplied at
      # runtime and this mount shadows the copy baked into the image. That baked copy
      # is the release artifact: in production the API only reads it, and nothing
      # mounts over it. Hence `data` is excluded from the build context except the
      # `.db` files themselves — run state stays out, the corpus ships.
      - ./data:/app/data
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/api/src
        - action: sync
          path: ./packages/bdheal/src
          target: /app/packages/bdheal/src
        # The suites too: without these, `compose exec api pytest` runs whatever tests
        # were baked into the image and reports green on a file it has never seen.
        # The roster and the lexicon are read at runtime, so an edit to either must reach
        # the container the same way source does.
        - action: sync
          path: ./api/config
          target: /app/api/config
        - action: sync
          path: ./api/tests
          target: /app/api/tests
        - action: sync
          path: ./packages/bdheal/tests
          target: /app/packages/bdheal/tests
        - action: rebuild
          path: ./api/pyproject.toml
        - action: rebuild
          path: ./packages/bdheal/pyproject.toml
        - action: rebuild
          path: ./uv.lock

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Every page is a Server Component, so fetches leave the web container and must
      # address the API by service name. A browser-side URL is deliberately not defined
      # here: nothing fetches from the browser yet, and an unused one invites a client
      # component to depend on config only compose supplies.
      API_URL: http://api:8000
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/package.json
    depends_on:
      - api
