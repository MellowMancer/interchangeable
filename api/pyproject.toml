[project]
name = "ixq"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bdheal",
    "fastapi>=0.115",
    "mcp>=1.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
bdheal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ixq"]

[dependency-groups]
dev = [
    "httpx2>=0.28",          # starlette's TestClient transport; tests only
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
ixq = "ixq.cli:app"
ixq-mcp = "ixq.api.mcp_server:main"
