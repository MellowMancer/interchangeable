# Active ingredients to compare across manufacturers.
#
# `id` is our slug, not any publisher's identifier: the same ingredient is named
# differently by every source, so the join key cannot be borrowed. Adding a substance is
# a change here and nowhere else.
#
# Chosen for the number of manufacturers each has on EMC, not for any expected finding:
# whether these labels disagree is what the pipeline is for, and picking substances
# because a disagreement was already suspected would make every result a foregone one.
# Every entry below was checked to have at least four distinct MA holders — a comparison
# of two labels is a coin toss, and the count is the only thing known before collecting.
substances:
  - id: ramipril
    name: Ramipril
  - id: metformin
    name: Metformin
  - id: atorvastatin
    name: Atorvastatin
  - id: amlodipine
