# The concept lexicon: what a label clause is *about*, independent of how it is worded.
#
# Patterns are matched case-insensitively as substrings, so stems beat whole words —
# `pregnan` covers pregnancy, pregnant and pregnancies without three entries.
#
# A clause matching nothing here is recorded as `unclassified` rather than dropped, and
# that count is published. Recall gaps are findings; silent losses are not.
#
# Concepts are clinical categories, not one-per-clause labels: a clause may carry several,
# and several clauses may share one. Widened 2026-08-20 against 194 real contraindication
# clauses from 47 EMC labels across the eight configured substances.
concepts:
  # --- organ systems and physiological state ---
  renal:              [renal, kidney, gfr, creatinine, nephro, haematuria, hematuria]
  hepatic:            [hepatic, liver, cirrhosis, cholestasis, jaundice]
  cardiac:            [cardiac, heart failure, myocardial, cardiogenic, cardiomyopathy]
  cardiac_outflow:    [outflow tract, aortic stenosis, ventricle, obstructive]
  hypotension:        [hypotension, hypotensive]
  shock:              [shock]
  respiratory:        [respiratory, hypoxia, pulmonary, asthma, bronchospasm]
  metabolic_acidosis: [acidosis, ketoacidosis, ketosis]
  glycaemic_emergency: [pre-coma, precoma, diabetic coma]
  porphyria:          [porphyria]
  qt_prolongation:    [qt-interval, qt interval, qtc, torsade, long qt, arrhythmi]
  heart_block:        [heart block, atrioventricular, av block, bradycard, tachycard,
                       fibrillation, sick sinus, sinoatrial, sinu-atrial]
  serotonin:          [serotonin, ssri, triptan]
  thyroid:            [thyroid, thyrotoxic, myxoedema, myxedema]
  electrolyte:        [kalaem, kalem, natraem, natrem, calcaem, calcem, magnesaem,
                       sodium level, potassium]
  endocrine:          [addison, adrenal, cushing, phaeochromocytoma, pheochromocytoma]
  diabetes_type:      [type 1 diabetes, type i diabetes, insulin-dependent]
  vascular:           [peripheral arterial, raynaud, occlusive disease, ischaem, ischem,
                       claudication]
  enzyme_deficiency:  [g6pd, glucose-6-phosphate, deficiency]
  ocular:             [ophthalmic, ocular, glaucoma, intraocular]

  # --- immune and reaction ---
  hypersensitivity:   [hypersensitiv, allergic, allergy, anaphyla]
  angioedema:         [angioedema, angio-oedema, angioneurotic]

  # --- life stage ---
  pregnancy:          [pregnan, trimester, gestation, child-bearing, childbearing]
  breastfeeding:      [lactation, breast-feed, breastfeed, nursing mother]
  paediatric:         [children, paediatric, pediatric, infant, neonate, adolescent]
  elderly:            [elderly]

  # --- exposures and interactions ---
  alcohol:            [alcohol]
  concomitant_drug:   [concomitant, co-administration, combination with, treated with, treatment with,
                       antiviral, contraindicated with, use with]
  contrast_agent:     [contrast agent, iodinated, radiocontrast]
  immunisation:       [immunisation, immunization, live virus, vaccin]
  extracorporeal:     [extracorporeal, dialysis, apheresis]
  # A washout is one statement with many phrasings. Matching only "must not be initiated"
  # reported Wockhardt and Zentiva as silent on the 36-hour sacubitril washout their labels
  # do state ("must not be started until"), which is a false absence, not a disagreement.
  # Every phrasing must carry the *interval*, not just a prohibition. Bare "should not be
  # started" also matches "Treatment should not be started in patients with severe renal
  # impairment" — a false washout in 4.4, which is the same error as the false absence
  # this list was widened to fix, pointing the other way. Verified: dropping the bare
  # forms changes nothing on the corpus and stops matching ordinary prose.
  washout:            [must not be initiated, must not be commenced,
                       hours after taking the last dose, hours after the last dose,
                       discontinuation of treatment, monoamine oxidase, maoi,
                       days after stopping]

  # --- other absolute bars ---
  infection:          [infection, sepsis, septic]
  malignancy:         [cancer, carcinoma, malignan, tumour, tumor]
  dehydration:        [dehydration, hypovolaem, hypovolem]
  bleeding:           [haemorrhag, hemorrhag, bleeding, coagulop]
  thromboembolism:    [thromboembol, thrombosis, thrombotic, embolism, thrombophilia]
  haematological:     [bone marrow, leukopeni, leucopeni, thrombocytop, neutropeni,
                       anaemia, anemia, aplasia, hypoplasia, blood disorder, pancytopeni]
  gastrointestinal:   [gastrointestinal, ulcer, stomatitis, gastric, colitis, bowel]
  fertility:          [infertility, fertility]
  obstruction:        [obstruction, stenosis, perforation, ileus]
  excipient_intolerance: [galactose, lactase, fructose, sucrase, intoleran]
